services:

  postgres:
    image: postgres:17
    container_name: interviewos-postgres

    environment:
      POSTGRES_DB: interviewos
      POSTGRES_USER: interviewos
      POSTGRES_PASSWORD: interviewos

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: